# Scoretopia configuration example
#
# Copy to config/scoretopia.yaml and adjust for your Discord guild.
# Relative paths resolve against the directory containing this file.

# Discord channel name (not an ID — resolved by the bot adapter).
channels:
  reports: polytopia-reports # game started/finished posts and report output

# SQLite database file. Default: data/scoretopia.db (relative to this file).
database:
  path: data/scoretopia.db

# steam-test capture directories (setup/<key>/ and result/<key>/, each with a
# manifest.json). The bot polls it every poll_seconds; `scoretopia captures run`
# processes it once. Default path: data/captures (relative to this file).
captures:
  path: data/captures
  poll_seconds: 300

# Directory where screenshot attachments are saved before OCR.
# Default: data/inbox (relative to this file).
inbox:
  path: data/inbox

# Trusted Discord users who may approve sensitive ingest corrections immediately
# or Approve/Reject non-mod correction batches. Empty list = no mod bypass
# (every sensitive action queues mod_approval).
bot_mods:
  discord_user_ids:
    - "123456789012345678"

# Training artifact export directory (written on successful ingest commit).
# Default: data/training (relative to this file). Parsed here for forward compat.
training:
  path: data/training

# Scheduled reports. Each entry must use a known report name.
# channel references a key under channels (reports), not the name.
reports:
  active_games:
    enabled: true
    schedule: "0 9 * * *" # daily at 09:00 — cron parsed by scheduler (task 012)
    channel: reports

  recent_completions:
    enabled: true
    schedule: "0 10 * * 1" # Mondays at 10:00
    channel: reports
    lookback_days: 14 # report-specific: games completed in the last N days

  win_ratios:
    enabled: true
    schedule: "0 8 1 * *" # first day of month at 08:00
    channel: reports
