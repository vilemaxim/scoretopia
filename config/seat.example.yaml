# Seat control configuration example
#
# Copy to config/seat.yaml on the machine that runs the game client. This file
# is separate from scoretopia.yaml on purpose: seat control runs as its own
# user and holds no Discord token and no database (ADR 003). A key that is not
# listed here is refused.
# Relative paths resolve against the directory containing this file.

# Where the frame of a screen seat control did not recognise is saved. Frames
# can show player names: the directory and its files are readable by their
# owner only. Default: data/seat-frames.
frames:
  path: data/seat-frames

# Where captures are written: result/<key>/ with the screens of a finished
# game, setup/<key>/ with those of a started one, each with a manifest.json,
# and record.json, seat control's own record of what it has captured. Recording
# reads the captures through a shared group, so this is the directory its
# captures.path names. Default: data/captures.
captures:
  path: data/captures

# The orders file recording writes: the known players, whose invitations the
# seat accepts. Seat control only reads it, through the group it shares with
# recording, so this is the file recording's orders.path names. With no file
# here, nothing is accepted. Default: data/orders.json.
orders:
  path: data/orders.json

# The seat's own Polytopia name, as an invitation shows it. An invitation lists
# every player of its game, the seat among them, and the seat accepts when
# everyone else shown is a known player, so it has to know which name is its
# own. Not set: no invitation is accepted.
# seat_name: the-seats-name

# Seconds a command may spend before it stops itself. Must be under an hour, so
# that one hourly run never overlaps the next. Default: 3300.
budget_seconds: 3300

# The X display the game client runs on. Default: ":99".
display: ":99"

# The user X commands run as when a command is itself run as root.
# Default: steam.
x_user: steam
